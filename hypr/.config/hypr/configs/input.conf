
#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = pl
    kb_variant = legacy
    kb_model = pc105
    kb_options = devastator:map_sclk
    kb_rules =
    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
    #scroll_method = on_button_down
    #scroll_button = 274
    touchpad {
        natural_scroll = true
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
# Przesunięcie 3 palcami w lewo – zawsze do poprzedniego workspace
gesture = 3, left, workspace, -1

# Przesunięcie 3 palcami w prawo – do następnego workspace (tworzy, jeśli nie ma)
gesture = 3, right, workspace, +1


# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}
